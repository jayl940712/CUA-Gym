[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cua-gym"
version = "1.0.0"
description = "Playwright pipeline for WebArena tasks with deterministic Python rewards"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    # Browser and state-API execution
    "playwright>=1.44.0",
]

[project.optional-dependencies]
filter = [
    "openai>=1.40.0",
]
dev = [
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "pytest>=8.0.0",
]

[project.urls]
Homepage = "https://github.com/xlang-ai/CUA-Gym"
Paper    = "https://arxiv.org/abs/2605.25624"
Dataset  = "https://huggingface.co/datasets/xlangai/CUA-Gym"

[tool.setuptools.packages.find]
include = ["cua_gym_web*"]
exclude = ["hub*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
