# WebArena-only task taxonomy

platform:
  web:
    description: "Playwright tasks running against CUA-Gym-Hub WebArena mocks"
    match_rule: "Every app name begins with webarena_ and ends with _mock"

sites:
  gitlab:
    app: webarena_gitlab_mock
    domain: Software Development
  reddit:
    app: webarena_reddit_mock
    domain: Communication
  shopping:
    app: webarena_shopping_mock
    domain: E-commerce
  shopping_admin:
    app: webarena_shopping_admin_mock
    domain: E-commerce Administration
  classifieds:
    app: webarena_classifieds_mock
    domain: Classified Listings

evaluator_types:
  state:
    description: "Deterministic reward.py checks initial/current browser state"
  url:
    description: "Deterministic reward.py checks final routes and query values"
  dom:
    description: "Deterministic reward.py checks declared immutable DOM observations"

difficulty:
  easy:
    description: "One obvious route or short lookup"
  medium:
    description: "Several browser interactions or moderate information synthesis"
  hard:
    description: "Long workflow, mutation, or cross-site state tracking"

task_type:
  single_site:
    description: "One WebArena mock"
  cross_site:
    description: "Two or more supported WebArena mocks in one BrowserContext"
